<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>twig</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="twig is a web audio additive synthesizer for creating waves based on the harmonic series and other tuning systems. MIDI capable.">
    <meta name="keywords"
        content="additive synthesizer, web audio, harmonic series, tuning systems, MIDI, music, waveform, synthesis, audio app">
    <meta name="author" content="twig Synthesizer">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="twig (tone wheel interval generator)">
    <meta property="og:description"
        content="A machine for harmonics.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tonewheelgenerator.com/">
    <meta property="og:image" content="assets/twig.png">
    <meta property="og:site_name" content="TWIG">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="twig (tone wheel interval generator)">
    <meta name="twitter:description" content="Web audio additive synthesizer for harmonic series and tuning systems.">
    <meta name="twitter:image" content="assets/twig.png">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!-- Application Styles -->
    <link rel="stylesheet" href="dist/styles-compiled.css">
</head>

<body class="app-container">
    <!-- Fixed Top Navbar -->
    <nav class="navbar">
        <div class="navbar-row">
            <div class="navbar-section">
                <!-- Play/Stop Toggle -->
                <div class="play-toggle-container">
                    <span id="play-label" class="toggle-label active">Play</span>
                    <div id="play-toggle" class="toggle-switch" role="switch" aria-checked="false"
                        aria-label="Play/Stop control">
                    </div>
                </div>
                <!-- MIDI Mapping Button -->
                <button id="open-midi-mapping-btn" class="action-btn midi-btn"
                    aria-label="Open MIDI Mapping Modal">MIDI</button>
                <!-- Envelope Mode: Open (drone) vs ADSR (triggered) -->
                <div class="envelope-mode-container">
                    <span id="env-open-label" class="toggle-label active">Open</span>
                    <div id="envelope-mode-toggle" class="toggle-switch" role="switch" aria-checked="false"
                        aria-label="Envelope mode: Open or ADSR"></div>
                    <span id="env-adsr-label" class="toggle-label inactive">ADSR</span>
                </div>
                <!-- Performance recorder: audio + MIDI capture, takes, transport -->
                <div id="recorder-root" class="recorder-root"></div>
            </div>

            <div class="navbar-section center">
                <!-- Master Gain Control -->
                <div id="master-gain-slider-root" class="navbar-control-group"></div>
                <div id="master-slew-slider-root" class="navbar-control-group"></div>
            </div>
        </div>

        <div class="navbar-section logo">
            <p class="logo-text">twig</p>
        </div>
    </nav>


    <div class="page-shell embed-flatten">
        <!-- Surface toolbar (rendered by ToolbarComponent); hidden in the embed band -->
        <nav id="surface-toolbar" class="surface-toolbar" aria-label="Surfaces"></nav>
        <div class="page-content embed-flatten">
            <!-- Main Controls -->
            <div class="control-card embed-flatten">
                <!-- Every surface panel except the viz dock's, stacked: the
                     dock layout is then exactly two cells (stack | dock),
                     however many panels a surface shows at once -->
                <div class="surface-stack embed-flatten">
                <div id="m4l-fundamental-source-panel" class="control-row embed-flatten">
                    <!-- Signal source: oscillator bank or an external signal
                         through the resonant filter bank. Drop a sound file
                         anywhere on this section to load it. -->
                    <div id="oscillator-control-root" class="labeled-control">
                        <label for="source-mode-select">
                            <span class="control-label-text">Source</span>
                        </label>
                        <select id="source-mode-select" class="control-select" aria-label="Signal source">
                            <option value="oscillators">Oscillators</option>
                            <option value="adc">Audio In (ADC)</option>
                            <option value="soundfile">Sound File</option>
                            <option value="pink">Pink Noise</option>
                            <option value="white">White Noise</option>
                        </select>
                        <div id="source-adc-controls" class="start-harmonic-row hidden">
                            <select id="adc-device-select" class="control-select" aria-label="Audio input device"></select>
                            <select id="adc-channel-select" class="control-select" aria-label="Audio input channel"></select>
                        </div>
                        <div id="source-file-controls" class="start-harmonic-row hidden">
                            <input type="file" id="soundfile-input" accept="audio/*" aria-label="Sound file">
                            <span id="soundfile-name" class="start-harmonic-label"></span>
                        </div>
                        <div id="oscillator-picker" class="select-stepper">
                            <button type="button" class="action-btn select-step-btn" data-target="waveform-select"
                                data-step="-1" aria-label="Previous oscillator">&lt;-</button>
                            <select id="waveform-select" class="control-select">
                                <option value="sine">Sine</option>
                                <option value="square">Square</option>
                                <option value="triangle">Triangle</option>
                                <option value="sawtooth">Sawtooth</option>
                            </select>
                            <button type="button" class="action-btn select-step-btn" data-target="waveform-select"
                                data-step="1" aria-label="Next oscillator">-&gt;</button>
                        </div>
                        <div id="current-waveform-canvas-area" class="canvas-flex-area">
                            <!-- P5 canvas injected here -->
                        </div>
                    </div>

                    <!-- Fundamental & Waveform Controls Row -->
                    <div id="fundamental-control-root" class="labeled-control">
                        <label for="fundamental-input">
                            <span class="control-label-text">Fundamental Frequency</span>
                            <span class="fundamental-input-group">
                                <input type="number" id="fundamental-input" class="fundamental-input" value="130.81"
                                    step="0.01"> Hz
                            </span>
                        </label>

                        <!-- Fundamental & Keyboard Group -->
                        <div class="frequency-control-group">
                            <!-- Fundamental Frequency Control -->
                            <!-- Octave Controls -->
                            <div class="octave-control">


                                <button id="octave-down" class="action-btn btn-octave">&lt;-</button>
                                <span id="current-octave-display" class="octave-display">Octave 3</span>
                                <button id="octave-up" class="action-btn btn-octave">-&gt;</button>

                            </div>
                            <!-- Piano Keyboard -->
                            <div id="piano-keyboard" class="keyboard-container">
                                <!-- Keys will be generated by JavaScript -->
                            </div>
                        </div>
                    </div>

                    <!-- Overtone System (title + select) -->
                    <div id="spectral-system-root" class="system-selector labeled-control">
                        <label for="ratio-system-select">
                            <span class="control-label-text">Overtone System</span>
                            <button type="button" id="system-info-btn" class="info-icon"
                                aria-label="About this overtone system">?</button>
                        </label>
                        <div class="select-stepper">
                            <button type="button" class="action-btn select-step-btn" data-target="ratio-system-select"
                                data-step="-1" aria-label="Previous overtone system">&lt;-</button>
                            <select id="ratio-system-select" class="control-select">
                                <!-- Options will be populated by JavaScript -->
                            </select>
                            <button type="button" class="action-btn select-step-btn" data-target="ratio-system-select"
                                data-step="1" aria-label="Next overtone system">-&gt;</button>
                        </div>
                        <!-- The system's description, disclosed by the "?" button -->
                        <div id="system-description" class="system-description" hidden></div>
                        <!-- Start harmonic + any system-specific dials (stiffness,
                             stretch, …), always laid out inline together -->
                        <div id="system-dials-row" class="system-dials-row hidden"></div>
                        <!-- Overtone controls for md/lg screens -->
                        <div class="overtone-controls">
                            <div class="subharmonic-toggle-container">
                                <span class="toggle-label overtone">Overtone
                                    <small class="toggle-sublabel">otonality</small></span>
                                <div id="subharmonic-toggle" class="toggle-switch" role="switch"
                                    aria-checked="false" aria-label="Subharmonic/Overtone control"></div>
                                <span id="subharmonic-label" class="toggle-label inactive">Subharmonic
                                    <small class="toggle-sublabel">utonality</small></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Drawbars: full width, its own row -->
                <div id="drawbars-control-root" class="labeled-control">
                    <span>
                        Drawbars
                        <span id="drawbars-tabs" class="drawbars-tabs">
                            <button type="button" class="drawbars-tab active" data-view="gain">gain</button>
                            <button type="button" class="drawbars-tab" data-view="filter">filter</button>
                            <button type="button" class="drawbars-tab" data-view="sequence">sequence</button>
                            <button type="button" class="drawbars-tab" data-view="convolution">convolution</button>
                        </span>
                        <span id="drawbars-note" class="drawbars-note hidden"></span>
                        <!-- Surface modes: shape = every drag sculpts the whole
                             row (stands in for holding shift), link = every edit
                             applies to all overtones (stands in for cmd/ctrl) -->
                        <span class="drawbars-modes">
                            <button id="drawbar-shape-toggle" type="button" class="drawbars-mode-btn"
                                aria-pressed="false" title="Shape row: drags sculpt every bar with a waveform contour (or hold shift)">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 12c2-7 4-7 6 0s4 7 6 0 2-7 3 0" /></svg>
                                shape
                            </button>
                            <button id="drawbar-link-toggle" type="button" class="drawbars-mode-btn"
                                aria-pressed="false" title="Link all: every edit applies to all overtones (or hold cmd/ctrl)">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8.5 11.5a3 3 0 0 0 4.2 0l2.3-2.3a3 3 0 0 0-4.2-4.2l-1.3 1.3" /><path d="M11.5 8.5a3 3 0 0 0-4.2 0L5 10.8a3 3 0 0 0 4.2 4.2l1.3-1.3" /></svg>
                                link
                            </button>
                        </span>
                    </span>
                    <!-- Shape mode's panel docks here (DrawbarsController mounts
                         the strip-built panel; a band above the bars fits every
                         viewport, unlike the strip's own scrolling row) -->
                    <div id="drawbars-shape-dock" class="drawbars-shape-dock" hidden></div>
                    <div id="drawbars" class="drawbar-container">
                        <!-- Drawbars will be generated by JavaScript -->
                    </div>
                    <div class="drawbars-actions">
                        <!-- Convolution view only: baking an IR needs the
                             oscillator wavetable, but the Wavetable panel
                             that normally hosts "Create IR" can be a
                             whole section away (hidden entirely for
                             external sources) — a shortcut here saves
                             the trip while dialing in per-voice IRs. -->
                        <button id="create-ir-button-drawbars" type="button" role="button"
                            class="action-btn focus-ring action-btn-spaced hidden"
                            aria-label="Create convolution impulse response">Create IR</button>
                        <button id="reset-drawbars-button" type="button" role="button"
                            class="action-btn focus-ring action-btn-spaced"
                            aria-label="Reset drawbars">Reset</button>
                        <button id="randomize-drawbars-button" type="button" role="button"
                            class="action-btn focus-ring action-btn-spaced"
                            aria-label="Randomize drawbars">Randomize</button>

                    </div>
                </div>

                <!-- Voice surface: the inspector, full width (surfaces shell only) -->
                <div id="voice-control-root" class="labeled-control"></div>

                <!-- Play surface: the pad grid under the fundamental strip (surfaces shell only) -->
                <div id="pad-grid-root" class="labeled-control"></div>

                <!-- Settings surface: MIDI routing/mapping + recording settings.
                     In embed it's a full-band overlay opened by the same
                     navbar buttons (body.settings-open) -->
                <div id="settings-control-root" class="labeled-control">
                    <div class="settings-header">
                        <span class="settings-title">Settings</span>
                        <span class="settings-header-spacer"></span>
                        <button type="button" class="settings-close" aria-label="Close settings">&times;</button>
                    </div>
                    <div class="settings-group-title">MIDI</div>
                    <div id="midi-settings"></div>
                    <div class="settings-group-title">Recording</div>
                    <div id="recorder-settings"></div>
                </div>
                </div><!-- /.surface-stack -->

                <!-- Wavetable + Tonewheel: paired visualization/output panels
                     (the Wavetable surface, and the viz dock beside any other) -->
                <div class="wavetable-tonewheel-row embed-flatten">
                    <!-- Waveform + controls -->
                    <div id="result-control-root" class="labeled-control">
                        <label>
                            Wavetable
                        </label>
                        <!-- Two rows: the time-domain wave with the wavetable
                             actions, then its spectrum with the convolution
                             (IR) actions -->
                        <div class="result-grid">
                            <div id="waveform-canvas-area" class="result-canvas">
                                <!-- P5 canvas injected here -->
                            </div>
                            <div class="result-actions">
                                <button id="add-wave-button" type="button" role="button"
                                    class="action-btn focus-ring"
                                    aria-label="Create oscillator from the current timbre">Create Oscillator</button>
                                <div id="routing-control-root" class="download-group">
                                    <button id="export-wav-button" type="button" role="button"
                                        class="action-btn focus-ring"
                                        aria-label="Download wav">Download</button>
                                    <div id="routing-mode-group" class="routing-mode-group">
                                        <select name="routing-mode" id="routing-mode-select" class="control-select">
                                            <option value="mono" selected>Mono</option>
                                            <option value="stereo">Stereo</option>
                                            <option value="multichannel">Multichannel</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div id="spectrum-canvas-area" class="result-canvas">
                                <!-- Spectrum canvas injected here -->
                            </div>
                            <div class="result-actions">
                                <button id="create-ir-button" type="button" role="button"
                                    class="action-btn focus-ring"
                                    aria-label="Create convolution impulse response">Create IR</button>
                                <!-- Ring time for the next Create IR (dial mounted by JS) -->
                                <span class="ir-ring-row">
                                    <span class="start-harmonic-label">ring</span>
                                    <span id="ir-ring-root" class="ir-ring-root" title="IR ring time"></span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Main Tonewheel Canvas -->
                    <div id="tonewheel-container" class="labeled-control">
                        <!-- Main tonewheel p5.js canvas will be injected here -->
                        <div class="controls-overlay">
                            <!-- Responsive Visualization Overlay Controls -->
                            <div id="tonewheel-viz-controls" class="tonewheel-viz-controls">
                                <div id="spread-slider-root" class="viz-slider-row"></div>
                                <div id="viz-freq-slider-root" class="viz-slider-row"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Inspector sheet: the same editor beside any other surface.
             In-flow side column in landscape, overlay bottom sheet in
             portrait, full band overlay in embed (inspector.css). -->
        <aside id="inspector-sheet" class="inspector-sheet" aria-label="Overtone inspector" hidden></aside>
    </div>


    <!-- Status Message Container -->
    <div id="status-message" class="status-message hidden"></div>

    <!-- Application Modules -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script> -->
    <script type="module" src="dist/app.js"></script>
</body>

</html>
