<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>twig</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="twig is a web audio additive synthesizer for creating waves based on the harmonic series and other tuning systems. MIDI capable.">
    <meta name="keywords"
        content="additive synthesizer, web audio, harmonic series, tuning systems, MIDI, music, waveform, synthesis, audio app">
    <meta name="author" content="twig Synthesizer">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="twig (tone wheel interval generator)">
    <meta property="og:description"
        content="A machine for harmonics.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tonewheelgenerator.com/">
    <meta property="og:image" content="assets/twig.png">
    <meta property="og:site_name" content="TWIG">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="twig (tone wheel interval generator)">
    <meta name="twitter:description" content="Web audio additive synthesizer for harmonic series and tuning systems.">
    <meta name="twitter:image" content="assets/twig.png">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!-- Application Styles -->
    <link rel="stylesheet" href="dist/styles-compiled.css">
</head>

<body class="app-container pt-(--navbar-height-tall) md:pt-(--navbar-height)">
    <!-- Fixed Top Navbar -->
    <nav class="navbar top-0 left-0 right-0 fixed pr-22">
        <div
            class="flex flex-nowrap gap-3 px-8 py-4 justify-center md:justify-between h-(--navbar-height-tall) md:h-(--navbar-height)">
            <div class="navbar-section flex basis-auto">
                <!-- Play/Stop Toggle -->
                <div class="play-toggle-container flex-grow flex-wrap items-center">
                    <span id="play-label" class="toggle-label w-8 active">Play</span>
                    <div id="play-toggle" class="toggle-switch" role="switch" aria-checked="false"
                        aria-label="Play/Stop control">
                    </div>
                </div>
                <!-- MIDI Mapping Button -->
                <button id="open-midi-mapping-btn" class="action-btn ml-2"
                    aria-label="Open MIDI Mapping Modal">MIDI</button>
                <!-- Envelope Mode: Open (drone) vs ADSR (triggered) -->
                <div class="envelope-mode-container flex items-center gap-2 ml-4">
                    <span id="env-open-label" class="toggle-label active">Open</span>
                    <div id="envelope-mode-toggle" class="toggle-switch" role="switch" aria-checked="false"
                        aria-label="Envelope mode: Open or ADSR"></div>
                    <span id="env-adsr-label" class="toggle-label inactive">ADSR</span>
                </div>
            </div>

            <div
                class="navbar-section center flex flex-wrap  gap-3  md:flex-nowrap basis-1/3 [0_1_auto] justify-center">
                <!-- Master Gain Control -->
                <div id="master-gain-slider-root" class="navbar-control-group px-2 py-2"></div>
                <div id="master-slew-slider-root" class="navbar-control-group px-2 py-2"></div>
            </div>
        </div>

        <div class="navbar-section logo absolute right-8">
            <p class="text-lg font-semibold text-(--text-title)">twig</p>
        </div>
    </nav>

    <!-- Modal Root (for generic modal, always present, only one open at a time) -->
    <div id="modal-root"></div>

    <div class="flex embed-flatten">
        <div class="m-auto embed-flatten">
            <!-- Main Controls -->
            <div class="control-card embed-flatten">
                <div class="control-row flex flex-row gap-4 flex-wrap embed-flatten">
                    <!-- Waveform Selector -->
                    <div id="oscillator-control-root" class="labeled-control md:w-1/2 lg:w-1/2 w-full">
                        <label for="waveform-select">
                            Oscillator
                        </label>
                        <div class="select-stepper">
                            <button type="button" class="action-btn select-step-btn" data-target="waveform-select"
                                data-step="-1" aria-label="Previous oscillator">&lt;-</button>
                            <select id="waveform-select" class="control-select">
                                <option value="sine">Sine</option>
                                <option value="square">Square</option>
                                <option value="triangle">Triangle</option>
                                <option value="sawtooth">Sawtooth</option>
                            </select>
                            <button type="button" class="action-btn select-step-btn" data-target="waveform-select"
                                data-step="1" aria-label="Next oscillator">-&gt;</button>
                        </div>
                        <div id="current-waveform-canvas-area" class="flex-1">
                            <!-- P5 canvas injected here -->
                        </div>
                    </div>

                    <!-- Fundamental & Waveform Controls Row -->
                    <div id="fundamental-control-root" class="labeled-control md:w-1/2 lg:w-1/2 w-full">
                        <label for="fundamental-input">
                            Fundamental Frequency
                            <span class="fundamental-input-group">
                                <input type="number" id="fundamental-input" class="fundamental-input" value="130.81"
                                    step="0.01"> Hz
                            </span>
                        </label>

                        <!-- Fundamental & Keyboard Group -->
                        <div class="frequency-control-group">
                            <!-- Fundamental Frequency Control -->
                            <!-- Octave Controls -->
                            <div class="octave-control flex justify-center items-center gap-6">


                                <button id="octave-down" class="action-btn btn-octave">&lt;-</button>
                                <span id="current-octave-display" class="octave-display">Octave 3</span>
                                <button id="octave-up" class="action-btn btn-octave">-&gt;</button>

                            </div>
                            <!-- Piano Keyboard -->
                            <div id="piano-keyboard" class="keyboard-container">
                                <!-- Keys will be generated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="control-card embed-flatten">
                <div class="control-row flex flex-wrap gap-4 embed-flatten">
                    <div class="w-full xl:grid xl:grid-cols-2 xl:gap-6 flex flex-col md:flex-row md:gap-4 gap-4 embed-flatten">
                        <!-- Overtone System (title + select) -->
                        <div id="spectral-system-root"
                            class="system-selector labeled-control flex flex-col gap-2 xl:col-span-1 w-full p-2 md:min-w-[24rem]">
                            <label for="ratio-system-select">
                                Overtone System
                            </label>
                            <div class="select-stepper">
                                <button type="button" class="action-btn select-step-btn" data-target="ratio-system-select"
                                    data-step="-1" aria-label="Previous overtone system">&lt;-</button>
                                <select id="ratio-system-select" class="control-select">
                                    <!-- Options will be populated by JavaScript -->
                                </select>
                                <button type="button" class="action-btn select-step-btn" data-target="ratio-system-select"
                                    data-step="1" aria-label="Next overtone system">-&gt;</button>
                            </div>
                            <div id="start-harmonic-row" class="flex items-center gap-2 hidden">
                                <label for="start-harmonic-input" class="text-xs whitespace-nowrap">Start harmonic</label>
                                <input type="number" id="start-harmonic-input" class="fundamental-input w-20"
                                    value="1" min="1" max="64" step="1" autocomplete="off"
                                    aria-label="First partial of the overtone system">
                            </div>
                            <div id="system-description" class="system-description text-xs/5 text-gray-400 py-2"></div>
                            <!-- Overtone controls for md/lg screens -->
                            <div class="flex flex-col gap-2 md:mt-4">
                                <div
                                    class="subharmonic-toggle-container flex items-center justify-start gap-4 pt-2">
                                    <span class="toggle-label overtone">Overtone
                                        <small class="toggle-sublabel">otonality</small></span>
                                    <div id="subharmonic-toggle" class="toggle-switch" role="switch"
                                        aria-checked="false" aria-label="Subharmonic/Overtone control"></div>
                                    <span id="subharmonic-label" class="toggle-label inactive">Subharmonic
                                        <small class="toggle-sublabel">utonality</small></span>
                                </div>
                            </div>
                        </div>

                        <!-- Waveform + controls -->
                        <div id="result-control-root" class="labeled-control">
                            <label>
                                Wavetable
                            </label>
                            <div class="control-row xl:col-span-1 w-full relative flex flex-col gap-4">

                                <div id="waveform-canvas-area" class="flex-1">
                                    <!-- P5 canvas injected here -->
                                </div>
                                <div class="flex items-stretch justify-end gap-4">
                                    <button id="add-wave-button" type="button" role="button"
                                        class="action-btn focus-ring mx-1"
                                        aria-label="Reset drawbars">Create Oscillator</button>

                                    <div id="routing-control-root" class="download-group">
                                        <button id="export-wav-button" type="button" role="button"
                                            class="action-btn focus-ring mx-1"
                                            aria-label="Download wav">Download</button>
                                        <div id="routing-mode-group"
                                            class="routing-mode-group flex items-center gap-2 ml-2">
                                            <select name="routing-mode" id="routing-mode-select" class="control-select">
                                                <option value="mono" selected>Mono</option>
                                                <option value="stereo">Stereo</option>
                                                <option value="multichannel">Multichannel</option>
                                            </select>
                                        </div>
                                    </div>


                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="control-row grid grid-cols-1 lg:grid-cols-4 gap-4 embed-flatten">

                    <!-- Drawbars -->
                    <div id="drawbars-control-root" class="labeled-control max-w-[55rem] col-span-3">
                        <span>
                            Drawbars
                            <span id="drawbars-tabs" class="drawbars-tabs">
                                <button type="button" class="drawbars-tab active" data-view="gain">gain</button>
                                <button type="button" class="drawbars-tab" data-view="filter">filter</button>
                                <button type="button" class="drawbars-tab" data-view="sequence">sequence</button>
                            </span>
                        </span>
                        <div id="drawbars" class="drawbar-container">
                            <!-- Drawbars will be generated by JavaScript -->
                        </div>
                        <div class="flex justify-center">
                            <button id="reset-drawbars-button" type="button" role="button"
                                class="action-btn focus-ring mx-1"
                                aria-label="Reset drawbars">Reset</button>
                            <button id="randomize-drawbars-button" type="button" role="button"
                                class="action-btn focus-ring mx-1"
                                aria-label="Randomize drawbars">Randomize</button>

                        </div>
                    </div>

                    <!-- Main Tonewheel Canvas -->
                    <div id="tonewheel-container" class="canvas-container col-span-1">
                        <!-- Main tonewheel p5.js canvas will be injected here -->
                        <div class="controls-overlay">
                            <!-- Responsive Visualization Overlay Controls -->
                            <div id="tonewheel-viz-controls"
                                class="absolute top-2 right-2 md:top-4 md:right-4 z-10 bg-(--surface-deep)/70 rounded-xl p-2 md:p-3 shadow-lg flex flex-col gap-2 items-end w-auto max-w-xs md:max-w-sm opacity-0 pointer-events-none transition-opacity duration-500">
                                <div id="spread-slider-root" class="flex items-center gap-2 w-full"></div>
                                <div id="viz-freq-slider-root" class="flex items-center gap-2 w-full"></div>
                            </div>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>


    <!-- Status Message Container -->
    <div id="status-message" class="status-message hidden"></div>

    <!-- Application Modules -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script> -->
    <script type="module" src="dist/app.js"></script>
</body>

</html>
